{{ define "main" }}
{{ $cfg := partial "func/defaults" . }}
<div class="container">
  <article class="post-single main-content">
    <header class="post-header">
      {{ partial "breadcrumbs.html" . }}
      <h1 class="post-title">{{ .Title }}</h1>
      <div class="post-meta">
        {{ with .Date }}
          <span>
            {{ partial "icons/calendar.html" }}
            <time datetime="{{ .Format "2006-01-02T15:04:05Z07:00" }}">{{ .Format $cfg.dateFormat }}</time>
          </span>
        {{ end }}
      </div>
    </header>

    <div class="post-content">
      {{ .Content }}
    </div>

    <footer>
      {{ with .Params.tags }}
      <div class="post-tags">
        {{ range . }}
          <a href="{{ "tags/" | relLangURL }}{{ . | urlize }}/" class="tag-link">{{ . }}</a>
        {{ end }}
      </div>
      {{ end }}
    </footer>
  </article>
</div>
{{ end }}
